name: issue-to-pr

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request == null
    env:
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/claude-sonnet-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install opencode and helpers
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq git xdg-utils
          git config --global user.name "opencode-issue-bot"
          git config --global user.email "usald2533-boop[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Create branch
        run: git checkout -b fix/issue-${{ github.event.issue.number }}

      - name: opencode implements the fix and opens the PR
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opencode run --model "$OPENCODE_MODEL" "
          You are the triage-and-fix bot for this repository.

          Issue #${{ github.event.issue.number }} was just opened here:
          github.com/usald2533-boop/jubilant-garbanzo/issues/${{ github.event.issue.number }}

          Read the issue and its comments with gh issue view ${{ github.event.issue.number }}.
          Reproduce the problem, then implement a minimal fix, feature, or doc change.
          Add or update tests if a test harness exists, and run the available
          build/lint/test checks.

          Then:
          1. git add -A && git commit -m 'fix: address issue #${{ github.event.issue.number }}'
             (use feat:/docs:/chore: if that fits the change better)
          2. git push -u origin HEAD
          3. gh pr create --base ${{ github.event.repository.default_branch }} \
             --title 'Fix issue #${{ github.event.issue.number }}' \
             --body 'Resolves #${{ github.event.issue.number }}. Auto-generated by opencode.'

          If you cannot fix it (missing context, blocked, out of scope), do not push;
          instead leave a comment on the issue with gh issue comment ${{ github.event.issue.number }}
          explaining why, and stop.
          "

      - name: Fallback PR if the agent did not open one
        if: failure()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m 'chore: wip for issue #${{ github.event.issue.number }}'
          git push -u origin HEAD
          gh pr create --base ${{ github.event.repository.default_branch }} \
            --title 'Fix issue #${{ github.event.issue.number }}' \
            --body 'Auto-opened (agent run failed). Resolves #${{ github.event.issue.number }}.'
